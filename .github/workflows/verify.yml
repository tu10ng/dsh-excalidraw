name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No dependencies to install: the Host half is plain Node, the browser half
      # is plain ES modules, and the vendor bundle is committed.
      - run: npm run verify
